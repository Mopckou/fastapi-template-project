version: '3.8'

services:
    pg:
        image: postgres:12-alpine
        ports:
            - "5434:5432"
        environment:
            - POSTGRES_USER=user
            - POSTGRES_PASSWORD=pass
            - POSTGRES_DB=app
        healthcheck:
            test: [ "CMD-SHELL", "sh -c 'pg_isready -U user -d ${POSTGRES_DB}'" ]
            interval: 10s
            timeout: 3s
            retries: 3

    migration:
        build: .
        image: app
        command: alembic upgrade head
        environment:
            SQLALCHEMY_DATABASE_URI: postgresql://user:pass@pg:5432/app
        restart: on-failure
        depends_on:
            - pg

    server:
        image: app
        ports:
            - "8080:8080"
        depends_on:
            - migration
        environment:
            DB_URL: postgresql+asyncpg://user:pass@pg:5434/app
            DEBUG: true